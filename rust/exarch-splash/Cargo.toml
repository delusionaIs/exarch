[package]
name = "exarch-splash"
version = "2.0.0"
edition = "2021"
description = "Exarch's logo as spinning 3D character art, for terminals and the live wallpaper"
license = "MIT"

# No dependencies on purpose: builds offline, nothing to audit but this file.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
