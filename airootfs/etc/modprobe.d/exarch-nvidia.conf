# Exarch NVIDIA defaults (harmless on non-NVIDIA machines)
# Kernel modesetting + framebuffer: needed by Wayland, gives a sharp console.
options nvidia_drm modeset=1 fbdev=1
# Keep VRAM contents across suspend. Exarch uses the nvidia-suspend/resume/
# hibernate services for that, so the kernel suspend notifiers (on by default
# since driver 615.78.08) stay off: two mechanisms at once can mean a black
# screen after resume.
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp NVreg_UseKernelSuspendNotifiers=0
