# Exarch NVIDIA defaults (harmless on non-NVIDIA machines)
# Kernel modesetting + framebuffer: needed by Wayland, gives a sharp console.
options nvidia_drm modeset=1 fbdev=1
# Keep VRAM contents across suspend (pairs with nvidia-suspend/resume services)
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp
